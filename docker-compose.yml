services:
  kiro-go:
    build: .
    ports:
      - "8080:8080"
      - "3128:3128"
      - "4649:4649"
      - "6588:6588"
      - "8008:8008"
      - "9091:9091"
    volumes:
      - ./data:/app/data
      # Bind-mount the host's Kiro IDE SSO cache so the "Inject" button can write
      # kiro-auth-token.json straight to the host. Required for account injection.
      # The host path defaults to the macOS/Linux location (~/.aws/sso/cache); set
      # KIRO_HOST_CACHE_DIR in .env to override (e.g. on Windows). See .env.example.
      - "${KIRO_HOST_CACHE_DIR:-${HOME}/.aws/sso/cache}:/host-kiro-cache"
      # Bind-mount the IDE's globalStorage (holds profile.json, the active-profile
      # pointer) so Inject can also pin the correct profileArn. Without this the
      # IDE keeps a stale arn from a prior login and usage/model-list calls 403
      # when switching to an account on a different backend. The host path defaults
      # to the macOS location; on Linux/Windows the globalStorage dir lives
      # elsewhere, so set KIRO_HOST_PROFILE_DIR in .env to override (the path has a
      # space on macOS, hence the quotes). See .env.example for per-OS values.
      - "${KIRO_HOST_PROFILE_DIR:-${HOME}/Library/Application Support/Kiro/User/globalStorage/kiro.kiroagent}:/host-kiro-profile"
    environment:
      - CONFIG_PATH=/app/data/config.json
      - LOOPBACK_HOST=0.0.0.0
      # Public bind (0.0.0.0) with the current weak posture (default admin
      # password / auth-off) is refused by the startup safety gate. This override
      # downgrades that hard-fail to a loud warning. INSECURE — set a strong
      # ADMIN_PASSWORD and enable API-key auth to remove the exposure properly.
      - ALLOW_INSECURE_PUBLIC_BIND=true
      # Where the inject feature writes the token file (the bind-mount target above).
      - KIRO_INJECT_CACHE_DIR=/host-kiro-cache
      # Where the inject feature writes profile.json (the globalStorage bind-mount).
      - KIRO_INJECT_PROFILE_DIR=/host-kiro-profile
      # Keep WARN visible. The stream-integrity guard reports a recovered upstream
      # truncation at WARN ("[StreamIntegrity] ... retrying same account"), which is
      # the only signal that a turn would otherwise have ended empty. config.json's
      # logLevel is rewritten by the running service, so pinning it here (env wins
      # over config, see logger.Init) is what keeps that evidence from disappearing.
      - LOG_LEVEL=warn
    restart: unless-stopped
    networks:
      - websearch
    depends_on:
      - searxng

  # SearXNG is the free, primary web-search provider. It is deliberately NOT
  # published to the host: there is no `ports:` mapping, so nothing outside the
  # Docker network can reach it (SSRF / abuse guard). kiro-go reaches it over the
  # shared `websearch` network at http://searxng:8080 — matches
  # webSearch.searxng.baseUrl in config.json.
  #
  # The network is NOT marked `internal`, because SearXNG itself needs outbound
  # internet to query upstream engines. "Not publicly exposed" is achieved by
  # omitting the port mapping, not by cutting SearXNG's egress.
  #
  # JSON output must be enabled in searxng/settings.yml (search.formats: [html, json]);
  # a stock instance returns 403 for format=json otherwise.
  searxng:
    image: docker.io/searxng/searxng:latest
    volumes:
      # Read-write: the SearXNG entrypoint may write generated state into
      # /etc/searxng on first boot. settings.yml itself is safe to edit in-repo.
      - ./searxng:/etc/searxng
    environment:
      # Internal base URL; used by SearXNG for absolute links only, not exposed.
      - SEARXNG_BASE_URL=http://searxng:8080/
    restart: unless-stopped
    networks:
      - websearch
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Shared bridge for kiro-go <-> searxng. SearXNG has no published ports, so it
  # is reachable only by services on this network, while still retaining the
  # outbound internet access it needs to run searches.
  websearch:
    driver: bridge
